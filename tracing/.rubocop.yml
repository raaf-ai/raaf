inherit_from:
  - '../.rubocop_app_cops.yml'

# A child config's `Exclude` replaces an inherited one rather than adding to it,
# which would drop every entry ../.rubocop_todo.yml records for this gem the
# moment this file names the same cop. Merging keeps both.
inherit_mode:
  merge:
    - Exclude


plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'bin/**/*'
    - 'pkg/**/*'

Layout/LineLength:
  Max: 120
  AllowedPatterns:
    - '\A\s*#'  # Allow long comments
    - '\A\s*it\s'  # Allow long RSpec test descriptions
    - '\A\s*describe\s'  # Allow long RSpec describe blocks
    - '\A\s*context\s'  # Allow long RSpec context blocks

Metrics/AbcSize:
  Max: 25

Metrics/MethodLength:
  Max: 20
  CountAsOne: ['array', 'hash', 'heredoc']

Metrics/ClassLength:
  Max: 150

Metrics/ModuleLength:
  Max: 150

Metrics/BlockLength:
  Max: 25
  Exclude:
    - 'spec/**/*'
    - 'examples/**/*'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Layout/EmptyLinesAroundClassBody:
  Enabled: true
  EnforcedStyle: empty_lines

Layout/EmptyLinesAroundModuleBody:
  Enabled: true
  EnforcedStyle: empty_lines

Naming/FileName:
  Enabled: true
  Exclude:
    - 'lib/**/*.rb'

RSpec/ExampleLength:
  Max: 20

RSpec/MultipleExpectations:
  Max: 5

RSpec/NestedGroups:
  Max: 5

RSpec/DescribeClass:
  Enabled: false

# Both middlewares wrap `@app.call` to record the request span, and a span that
# is only closed for StandardError leaves a dangling span whenever the app dies
# of anything else. They rescue Exception to stamp the span and `raise` on the
# next line, so nothing is swallowed — which is the thing this cop exists to
# catch.
Lint/RescueException:
  Exclude:
    - 'lib/raaf/tracing/rack_middleware.rb'
    - 'lib/raaf/tracing/rails_middleware.rb'

# Both examples exist to show what `eval` does to a tool that takes user input —
# one of them is titled "CRITICAL SECURITY RISK" in its own comments. Flagging
# the demonstration is the cop working on the wrong file.
Security/Eval:
  Exclude:
    - 'examples/**/*'
